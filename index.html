<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>한 끼 여행 | 식도락 여행 계획표</title>
  <style>
    :root{--ink:#29251f;--paper:#fbf7ee;--orange:#e75b2b;--yellow:#f8bd4a;--green:#386b5a}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 8% 0,#ffe2a5,transparent 28%),var(--paper);color:var(--ink);font-family:Arial,"Apple SD Gothic Neo",sans-serif}main{max-width:1160px;margin:auto;padding:62px 24px 90px}.tag{font-size:12px;letter-spacing:.12em;font-weight:bold;color:var(--orange)}h1,h2{font-family:Georgia,"Nanum Myeongjo",serif;letter-spacing:-.06em}h1{font-size:clamp(46px,7vw,76px);line-height:.94;margin:12px 0 16px}h1 em,h2 em{font-style:normal;color:var(--orange)}.intro{max-width:590px;color:#70685d;line-height:1.7}.box{margin-top:42px;background:#fffdf8;border:1px solid #d9cebc;border-radius:24px;padding:30px;box-shadow:0 16px 42px #76573112}.step{font-size:12px;font-weight:bold;letter-spacing:.1em;color:var(--orange);margin-bottom:14px}.step b{display:inline-grid;place-items:center;width:25px;height:25px;border-radius:50%;background:var(--orange);color:white;margin-right:8px;font-size:11px}.trip-form{display:grid;grid-template-columns:1.4fr 1.8fr 1fr 1fr auto;gap:10px;align-items:end}label{display:grid;gap:7px;font-size:12px;font-weight:bold;color:#776d60}input,select{width:100%;height:48px;border:1px solid #ded4c5;border-radius:10px;background:#fffdfa;padding:0 12px;color:var(--ink);font:inherit}input:focus,select:focus{outline:3px solid #e75b2b28;border-color:var(--orange)}.dates{display:flex;align-items:center;gap:5px}.dates input{min-width:0}.primary{height:48px;border:0;border-radius:10px;background:var(--ink);color:white;padding:0 16px;font-weight:bold;white-space:nowrap;cursor:pointer}.primary:hover{background:var(--orange)}#plan{display:none;margin-top:38px}.summary{background:var(--green);color:white;border-radius:18px;padding:28px 30px;background-image:radial-gradient(circle at 90% 0,#8fba9f88,transparent 32%)}.summary small{color:#c6e1d2}.summary h2{font-size:clamp(26px,3.3vw,40px);font-weight:normal;line-height:1.15;margin:10px 0}.summary strong{color:var(--yellow)}.summary p{font-size:13px;color:#d9e9e0;margin:0}.maker{border:1px solid #e2d8c9;border-radius:16px;padding:14px;margin:16px 0 40px}.menu-form{display:flex;gap:8px}.menu-form input{flex:1}.extras{display:flex;gap:7px;align-items:center;flex-wrap:wrap;margin-top:12px;font-size:12px;color:#7e7366}.extras button{border:1px solid #d8ccba;background:#fffdf8;border-radius:99px;padding:7px 10px;cursor:pointer}.board-title{display:flex;align-items:end;justify-content:space-between;margin-bottom:16px}.board-title h2{font-size:29px;margin:0}.help{color:#8a7d6e;font-size:12px;text-align:right;line-height:1.5}.board{display:grid;grid-template-columns:195px 1fr;border:1px solid #d9cebc;border-radius:18px;overflow:hidden;background:white}.pool{padding:15px;background:#f6f0e5;border-right:1px solid #e7decf;min-height:480px}.pool-title{font-size:13px;font-weight:bold;display:flex;justify-content:space-between;margin-bottom:12px}.badge{background:var(--orange);color:white;border-radius:50%;font-size:11px;padding:4px 7px}.cards{display:grid;gap:8px}.empty{margin:40px 0;color:#9b9082;text-align:center;font-size:12px;line-height:1.7}.card{position:relative;border:0;border-radius:9px;min-height:52px;padding:8px;text-align:left;display:grid;grid-template-columns:26px 1fr;background:white;box-shadow:0 2px 6px #654a2620;cursor:grab}.card.selected{outline:2px solid var(--orange)}.card span{grid-row:span 2;font-size:18px}.card b{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.card small{font-size:10px;color:#887c6e}.delete-card{position:absolute;right:6px;top:6px;width:20px;height:20px;border:0;border-radius:50%;background:#ffffffa8;color:#7d5546;font-size:16px;line-height:18px;cursor:pointer}.delete-card:hover{background:var(--orange);color:white}.free{background:#fff0c7}.breakfast{background:#fff0c7}.lunch{background:#ffd8c5}.dinner{background:#d7e9db}.snack-am,.snack-pm{background:#f5e1bc}.night{background:#e3ddf1}.table{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));overflow-x:auto}.day{min-width:180px;border-right:1px solid #e7decf}.day:last-child{border:0}.day header{height:51px;display:flex;align-items:center;justify-content:space-between;padding:0 12px;border-bottom:1px solid #e7decf;font-size:13px}.day header span{background:#f4eddf;border-radius:99px;padding:4px 7px;font-size:10px;color:#887c6e}.slot{height:76px;position:relative;padding:10px;border-bottom:1px solid #eee7dd;cursor:pointer}.slot.small{height:42px;padding-top:7px;background:#fffcf6}.slot.small.filled{height:67px}.slot.small .placed{margin-top:3px;padding:5px 7px}.slot.off{cursor:not-allowed;background:repeating-linear-gradient(135deg,#faf7f1,#faf7f1 5px,#f7f3ec 5px,#f7f3ec 10px)}.slot-label{font-size:11px;color:#766b5d;font-weight:bold}.small .slot-label{font-size:10px}.hint{position:absolute;right:11px;top:50%;transform:translateY(-50%);color:#cbbfaf;font-size:20px}.placed{display:block;width:100%;border:0;border-radius:7px;padding:7px;margin-top:6px;text-align:left;font-weight:bold;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;box-shadow:inset 3px 0 #7c5140;cursor:pointer}@media(max-width:850px){.trip-form{grid-template-columns:1fr 1fr}.place,.trip-form .primary{grid-column:span 2}}@media(max-width:600px){main{padding:38px 15px}.box{padding:20px}.trip-form{grid-template-columns:1fr}.place,.trip-form .primary{grid-column:span 1}.menu-form{display:grid}.board{grid-template-columns:1fr}.pool{border-right:0;border-bottom:1px solid #e7decf;min-height:auto}.cards{grid-template-columns:repeat(2,1fr)}.empty{grid-column:span 2;margin:12px}.table{grid-template-columns:repeat(3,180px)}}
  </style><style>.slot.filled.has-location{height:auto;min-height:105px}.location{margin-top:5px}.location-add,.location-remove,.location-search button,.location-result{border:0;border-radius:6px;font:inherit;cursor:pointer}.location-add{padding:4px 6px;background:#fffdf8;color:#776d60;font-size:10px}.location-editor{margin-top:5px;padding:7px;border:1px solid #ded4c5;border-radius:7px;background:#fffdf8}.location-search{display:flex;gap:4px}.location-search input{height:30px;padding:0 7px;font-size:10px}.location-search button{padding:0 7px;background:var(--ink);color:#fff;font-size:10px;white-space:nowrap}.location-results{display:grid;gap:4px;margin-top:6px}.location-result{padding:5px;text-align:left;background:#f5eee3;font-size:10px;line-height:1.35}.location-result small{display:block;color:#82776b;margin-top:2px}.location-link{display:block;color:#5b412c;font-size:10px;font-weight:bold;text-decoration:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.location-address{display:block;color:#82776b;font-size:9px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.location-remove{float:right;padding:0 4px;background:transparent;color:#8b7462;font-size:13px}</style>
<style>.card-location{grid-column:2;margin-top:3px}.card-location .location-editor{min-width:140px}</style></head>
<body><main>
  <div class="tag">TASTE-FIRST TRIP PLANNER</div><h1>한 끼씩 채우는<br><em>맛있는 여행.</em></h1><p class="intro">가고 싶은 곳과 시간을 적으면, 그 여행에서 즐길 수 있는 식사를 시간표로 펼쳐드려요.</p>
  <section class="box"><div class="step"><b>01</b>여행의 시작</div>
    <form id="tripForm" class="trip-form"><label class="place">먼저 어디로 갈까요?<input id="place" required placeholder="예: 부산, 전주, 교토"></label><label>여행 기간<div class="dates"><input id="start" type="date" required><span>—</span><input id="end" type="date" required></div></label><label>도착 시간<input id="arrival" type="text" inputmode="numeric" maxlength="8" required value="1130" placeholder="예: 0930"></label><label>떠나는 시간<input id="departure" type="text" inputmode="numeric" maxlength="8" required value="1600" placeholder="예: 1745"></label><button class="primary">식사 시간표 만들기 →</button></form>
    <section id="plan"><div class="summary"><small id="where">⌖ 여행지에서의 식사</small><h2>아침 <strong id="bCount">0끼</strong>, 점심 <strong id="lCount">0끼</strong>, 저녁 <strong id="dCount">0끼</strong>를<br>계획할 수 있어요!</h2><p>작은 간식과 야식은 필요할 때마다 자유롭게 더해보세요.</p></div>
      <div class="step" style="margin-top:32px"><b>02</b>먹고 싶은 메뉴는 무엇인가요?</div><div class="maker"><form id="menuForm" class="menu-form"><input id="menuName" placeholder="예: 고등어구이, 냉면, 말차 라떼"><button class="primary">메뉴 블록 만들기</button></form></div>
      <div class="board-title"><h2><em>03</em> 시간표에 쏙, 넣어주세요.</h2><p class="help">블록을 끌어다 놓으세요<br>또는 블록을 선택한 뒤 빈 칸을 누르세요.</p></div><div class="board"><aside class="pool"><div class="pool-title">메뉴 블록 <span id="badge" class="badge">0</span></div><div id="cards" class="cards"><p class="empty">위에서 메뉴를 만들면<br>여기에 쌓여요.</p></div></aside><div id="table" class="table"></div></div>
    </section>
  </section>
</main><script src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=b08c8c05d17732a02a5d8ee867430368&libraries=services"></script><script>
const info={free:['자유 메뉴','🍽️','meal'],breakfast:['아침','☀️','meal'], 'snack-am':['오전 간식','🍪','small'],lunch:['점심','🍜','meal'],'snack-pm':['오후 간식','🧁','small'],dinner:['저녁','🌙','meal'],night:['야식','🍺','small']};let cards=[],placed={},chosen=null,drag=null,slots=[];
const $=id=>document.getElementById(id),m=input=>{let saved=input.dataset.minutes;if(saved!==undefined)return Number(saved);let digits=input.value.replace(/\D/g,'');if(!/^\d{4}$/.test(digits))return NaN;let hour=Number(digits.slice(0,2)),minute=Number(digits.slice(2));return hour<24&&minute<60?hour*60+minute:NaN},fmt=d=>d.toLocaleDateString('ko-KR',{month:'long',day:'numeric',weekday:'short'}),key=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
function formatTime(input){let digits=input.value.replace(/\D/g,'');if(!/^\d{4}$/.test(digits))return false;let hour=Number(digits.slice(0,2)),minute=Number(digits.slice(2));if(hour>23||minute>59)return false;input.dataset.minutes=hour*60+minute;input.value=`${hour<12?'오전':'오후'} ${hour%12||12}:${String(minute).padStart(2,'0')}`;return true}
function setTimeInput(id){let input=$(id);input.oninput=()=>{delete input.dataset.minutes;if(input.value.replace(/\D/g,'').length===4)formatTime(input)};formatTime(input)}
function add(name,type){cards.push({id:Date.now()+Math.random(),name,type});renderCards()}
function addLocation(card,holder,slot){holder.innerHTML='';holder.onclick=e=>e.stopPropagation();if(card.location){let remove=document.createElement('button'),link=document.createElement('a'),address=document.createElement('small');remove.className='location-remove';remove.type='button';remove.textContent='×';remove.title='위치 삭제';remove.onclick=()=>{delete card.location;renderCards();renderTable()};link.className='location-link';link.href=card.location.url;link.target='_blank';link.rel='noopener';link.textContent='📍 '+card.location.name;address.className='location-address';address.textContent=card.location.address;holder.append(remove,link,address);return}let addButton=document.createElement('button');addButton.className='location-add';addButton.type='button';addButton.textContent='+ 위치 추가';addButton.onclick=()=>{slot.classList.add('has-location');addButton.remove();let editor=document.createElement('div'),form=document.createElement('div'),input=document.createElement('input'),search=document.createElement('button'),results=document.createElement('div');editor.className='location-editor';form.className='location-search';input.placeholder='장소명 또는 주소 검색';input.value=card.name;search.type='button';search.textContent='카카오맵 검색';results.className='location-results';let run=()=>{let query=input.value.trim();if(!query)return;if(!(window.kakao&&kakao.maps&&kakao.maps.services)){alert('카카오맵을 불러오지 못했습니다. JavaScript SDK 도메인 설정을 확인해 주세요.');return}results.textContent='검색 중…';new kakao.maps.services.Places().keywordSearch(query,(data,status)=>{results.innerHTML='';if(status!==kakao.maps.services.Status.OK){results.textContent='검색 결과가 없습니다.';return}data.slice(0,5).forEach(place=>{let result=document.createElement('button'),address=document.createElement('small');result.className='location-result';result.type='button';result.textContent=place.place_name;address.textContent=place.road_address_name||place.address_name||'';result.append(address);result.onclick=()=>{card.location={name:place.place_name,address:place.road_address_name||place.address_name||'',url:place.place_url||`https://map.kakao.com/link/search/${encodeURIComponent(place.place_name)}`};renderCards();renderTable()};results.append(result)})})};search.onclick=run;input.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();run()}};form.append(input,search);editor.append(form,results);holder.append(editor);input.focus()};holder.append(addButton)}
function renderCards(){let free=cards.filter(c=>!Object.values(placed).some(x=>x.id===c.id));$('badge').textContent=free.length;$('cards').innerHTML=free.length?'':'<p class="empty">위에서 메뉴를 만들면<br>여기에 쌓여요.</p>';free.forEach(c=>{let e=document.createElement('div'),location=document.createElement('div');e.className='card '+c.type+(chosen===c.id?' selected':'');e.draggable=true;e.tabIndex=0;e.innerHTML=`<span>${info[c.type][1]}</span><b>${c.name}</b><button class="delete-card" type="button" aria-label="${c.name} 삭제">×</button>`;e.onclick=x=>{if(x.target.closest('.delete-card'))return;chosen=chosen===c.id?null:c.id;renderCards()};e.onkeydown=x=>{if(x.key==='Enter'){chosen=chosen===c.id?null:c.id;renderCards()}};e.querySelector('.delete-card').onclick=x=>{x.stopPropagation();cards=cards.filter(item=>item.id!==c.id);Object.keys(placed).forEach(slot=>{if(placed[slot].id===c.id)delete placed[slot]});if(chosen===c.id)chosen=null;renderCards();renderTable()};e.ondragstart=()=>drag=c.id;e.ondragend=()=>drag=null;location.className='location card-location';addLocation(c,location,e);e.append(location);$('cards').append(e)})}
function renderTable(){let grouped={};slots.forEach(s=>(grouped[s.date]??=[]).push(s));$('table').innerHTML='';Object.entries(grouped).forEach(([date,arr],i)=>{let col=document.createElement('div'),total=Object.keys(grouped).length,status=total===1?'도착 · 귀가':i===0?'도착':i===total-1?'귀가':'여행 중';col.className='day';col.innerHTML=`<header><b>${fmt(new Date(date+'T00:00:00'))}</b><span>${status}</span></header>`;arr.forEach(s=>{let card=placed[s.id],e=document.createElement('div');e.className=`slot ${info[s.type][2]} ${s.ok?'':'off'} ${card?'filled':''} ${card&&card.location?'has-location':''}`;e.innerHTML=`<span class="slot-label">${info[s.type][1]} ${info[s.type][0]}</span>`;let put=id=>{let c=cards.find(x=>x.id===id);if(!s.ok||!c)return;placed[s.id]=c;chosen=null;renderCards();renderTable()};e.onclick=()=>!card&&put(chosen);e.ondragover=x=>s.ok&&x.preventDefault();e.ondrop=()=>put(drag);if(card){let p=document.createElement('button'),location=document.createElement('div');p.className='placed '+s.type;p.textContent=card.name;p.onclick=x=>{x.stopPropagation();delete placed[s.id];renderCards();renderTable()};location.className='location';addLocation(card,location,e);e.append(p,location)}else{let h=document.createElement('span');h.className='hint';h.textContent=s.ok?'+':'—';e.append(h)}col.append(e)});$('table').append(col)})}
$('tripForm').onsubmit=e=>{e.preventDefault();let a=$('start').value,z=$('end').value,ar=m($('arrival')),de=m($('departure'));if(!a||!z||a>z)return;if(Number.isNaN(ar)||Number.isNaN(de)){alert('도착 시간과 떠나는 시간을 24시간제 네 자리 숫자로 입력해 주세요. 예: 0930');return}let days=[];for(let d=new Date(a+'T00:00:00'),last=new Date(z+'T00:00:00');d<=last;d.setDate(d.getDate()+1)){let date=key(d),first=date===a,lastDay=date===z,b=(!first||ar<=540)&&(!lastDay||de>=540),l=(!first||ar<=780)&&(!lastDay||de>=720),di=(!first||ar<=1140)&&(!lastDay||de>=1080),am=(!first||ar<=630)&&(!lastDay||de>=570),pm=(!first||ar<=990)&&(!lastDay||de>=870),ni=(!first||ar<=1410)&&(!lastDay||de>=1230);[['breakfast',b],['snack-am',am],['lunch',l],['snack-pm',pm],['dinner',di],['night',ni]].forEach(([type,ok])=>days.push({id:date+'-'+type,date,type,ok}))}slots=days;placed={};$('where').textContent='⌖ '+($('place').value||'여행지')+'에서의 식사';$('bCount').textContent=days.filter(x=>x.type==='breakfast'&&x.ok).length+'끼';$('lCount').textContent=days.filter(x=>x.type==='lunch'&&x.ok).length+'끼';$('dCount').textContent=days.filter(x=>x.type==='dinner'&&x.ok).length+'끼';$('plan').style.display='block';renderTable();$('plan').scrollIntoView({behavior:'smooth',block:'start'})};
$('menuForm').onsubmit=e=>{e.preventDefault();let n=$('menuName').value.trim();if(n){add(n,'free');$('menuName').value=''}};
setTimeInput('arrival');setTimeInput('departure');
let today=new Date().toISOString().slice(0,10);$('start').value=today;$('end').value=today;
</script></body></html>
